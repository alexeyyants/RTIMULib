LIS3MDLXYPerformance=1
# Z performance: 0=Low,1=Medium,2=High,3=UltraHigh
LIS3MDLZPerformance=1
# Operation mode: 0=Continuous,1=Single-shot,3=Power-down
LIS3MDLOperationMode=0